# PUBLIC TEMPLATE - run the full observable zkdeal simulation purely from
# published Docker Hub images. No sibling source checkout or local image build
# is needed; only this public zkdeal-testing package.
#
# How to run:
#   1. Copy this file to params/public.generated.yaml (the *.generated.yaml
#      pattern is never committed).
#   2. In the copy set `status: READY` and set `gpu_name` to the exact name
#      `nvidia-smi --query-gpu=name --format=csv,noheader` reports; the
#      package refuses templates and unmeasured GPU identities by design.
#   3. Keep the digest-pinned defaults below on a B200 (compute capability
#      10.0). The package disables PTX JIT, so another GPU must use its matching
#      published architecture image rather than compiling a fallback at first
#      proof.
#   4. One-line run:
#      kurtosis run ./package/kurtosis.yml --args-file package/params/public.generated.yaml --enclave zkdeal-public --image-download missing
#
# Cases - select with the `case:` key below:
#   base    - the bootstrap acceptance alone: L1 (geth+Lighthouse) up, CUDA
#             prover healthy, one real room-batch proof verified on-chain.
#   amm-mev - two AMM rooms in one enclave: the naive sandwich-ordering room
#             first, the commit-reveal protected room second, so the enclave
#             carries both sides of the MEV ordering story. Set
#             `prove_queue: true` and `example_timeout: 60m` for this case.
#   auction - the auction example room. `prove_queue: true`,
#             `example_timeout: 40m`.
#   shop    - the shop example room. `prove_queue: true`,
#             `example_timeout: 40m`.
# Every non-base case also checkpoints its example rooms through the demo
# plane and gates on fee + queue evidence (see params/cases/ for the
# checked-in per-case templates the maintainers run).
status: TEMPLATE
protocol_version: 6
runner_timeout: 45m
case: base
# Prover segment size: "20" fits a 24-32 GB card; an 8 GB card needs
# "18"-"19" to leave room for the Groth16 wrap.
segment_po2: "20"
proof_samples: "3"
# Set true for the non-base cases above.
prove_queue: false
example_timeout: 45m
gpu_name: CURRENT_GPU_NOT_MEASURED
public_host: "127.0.0.1"
tls_enabled: true
# Optional: explorer_url. The package normally publishes its browser-correct
# `explorer` service at http://<public_host>:3200. Set this only when an
# operator deliberately fronts that service with another public proxy.
images:
  prover: docker.io/zkdeal/prover-cuda:sm100-6aff7be-20260827@sha256:ca96d3dc72531ea0126d3ce97657cb4bdba9f0b8eeb4a86edc9cd5ba6dba6164
  runner: docker.io/zkdeal/coordinator:20260827-coldproof-261448b37a59-d34a7fbfabdc@sha256:f892cb3cee19040ccd5adf10b6b9bc8d4b1826beda9a808aa76f632833919d7b
  server: docker.io/zkdeal/coordinator:20260827-coldproof-261448b37a59-d34a7fbfabdc@sha256:f892cb3cee19040ccd5adf10b6b9bc8d4b1826beda9a808aa76f632833919d7b
  geth: ethereum/client-go:v1.17.3@sha256:ee8af3a081fd8f780509541cf8115be03259e106375e50efa9d995400f86e15d
  lighthouse: sigp/lighthouse:v8.1.3@sha256:44aa773dcf274122c32cc41c4dae7124ed3cab5c267ee82174c6dfd9c688da96
